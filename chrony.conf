# ============================================================================
# SOVEREIGN FX TRADING BOT (Proda/NEXUS) - High-Precision Chrony Configuration
# ============================================================================
# Optimized for a non-colocated retail-grade trading system needing high clock accuracy.

# Sync against cloud-provider NTP servers (Google & AWS are Stratum-1/2 engines)
server time.google.com iburst preferred
server 169.254.169.123 iburst offline  # AWS Link-Local Time Sync (ignored if not on AWS)

# Stratum-1 & Stratum-2 High-Precision Public Servers
server time.cloudflare.com iburst
server time.nist.gov iburst

# Failover to standard pool NTP servers with regional geographic distribution
pool pool.ntp.org iburst maxsources 4

# Record the rate at which the system clock gains/losses time to correct oscillator drift.
driftfile /var/lib/chrony/drift

# Allow stepping the clock in the first 3 updates if the offset is larger than 10ms.
# This ensures that upon starting, any severe clock drift is corrected immediately.
makestep 0.01 3

# Enable kernel synchronization of the real-time clock (RTC).
rtcsync

# Specify log directory for tracking synchronization performance.
logdir /var/log/chrony
log measurements statistics tracking
